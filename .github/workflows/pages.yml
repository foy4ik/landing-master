# Публикация демо на GitHub Pages.
# Включите Pages: Settings → Pages → Source: GitHub Actions. Дальше сайт обновляется при каждом пуше в main.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build demo
        run: DEMO_URL="${{ steps.pages.outputs.base_url }}" bash scripts/build-demo.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
