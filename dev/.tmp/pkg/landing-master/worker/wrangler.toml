# Настройки Cloudflare Worker. Инструкция — в README.md, раздел «GitHub Pages + Cloudflare Worker».
name = "landing-form"
main = "index.js"
compatibility_date = "2026-09-01"

[vars]
# РЕДАКТИРОВАТЬ: адрес вашего сайта (откуда приходят заявки), без слэша в конце.
# Можно несколько через запятую: "https://example.ru,https://www.example.ru"
ALLOWED_ORIGINS = "https://example.ru"
# РЕДАКТИРОВАТЬ: куда присылать заявки (ваш chat_id или id группы/канала).
CHAT_ID = "123456789"
# Часовой пояс для времени в сообщении.
TIMEZONE = "Europe/Moscow"
# Защита от спама: минимальное время заполнения формы (сек) и лимит заявок с одного IP.
MIN_FILL_SECONDS = "3"
RATE_LIMIT_MAX = "3"
RATE_LIMIT_WINDOW = "600"

# Надёжный лимит частоты от Cloudflare (необязательно, раскомментируйте).
# Период может быть только 10 или 60 секунд. Если не включать, работает запасной лимит в памяти Worker.
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1001"
#   [ratelimits.simple]
#   limit = 3
#   period = 60

# ТОКЕН БОТА СЮДА НЕ ПИШЕМ. Он добавляется командой:   npx wrangler secret put BOT_TOKEN
